<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
<title id="title">UrbanPulse analysis workflow</title><desc id="desc">BIPAD historical incident records are audited and analyzed through temporal summaries, spatial clusters, municipality profiles and anomaly candidates, then explored in a Streamlit dashboard.</desc>
<rect width="1200" height="360" rx="22" fill="#f4f8f5"/>
<g font-family="Segoe UI,Arial,sans-serif"><text x="52" y="50" fill="#183b30" font-size="23" font-weight="700">From source records to an explorable analysis</text><text x="52" y="78" fill="#587267" font-size="14">A retrospective workflow over the saved BIPAD retrieval</text>
<g><rect x="52" y="132" width="190" height="132" rx="18" fill="#174c3d"/><text x="76" y="174" fill="#cbe7d3" font-size="13" font-weight="700">SOURCE</text><text x="76" y="207" fill="white" font-size="22" font-weight="700">BIPAD API</text><text x="76" y="235" fill="#d8e9de" font-size="14">Historical incidents</text></g>
<path d="M255 198h35" stroke="#749889" stroke-width="3"/><path d="m284 190 10 8-10 8" fill="none" stroke="#749889" stroke-width="3"/>
